<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="350" viewBox="0 0 1280 350" role="img" aria-label="Experiência do usuário, engenharia de software e integração de processos">
    <title>Experiência do usuário, engenharia de software e integração de processos</title><defs>
