    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7AA4CF" opacity=".17"/></pattern>
    </defs><style>text{font-family:'Segoe UI',Arial,sans-serif} .muted{fill:#9EADC6} .white{fill:#F2F6FD} .cyan{fill:#69DCF2} .label{font-size:15px;font-weight:600;letter-spacing:2.5px}</style><g transform="translate(0 0)"><rect x="1" y="1" width="414" height="328" rx="16" fill="#0B1423" stroke="#24364D"/><path d="M26 1h58" stroke="#50D6F1" stroke-width="2"/><g transform="translate(27 34)" stroke="#60DDF0" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="28" height="22" rx="4"/><path d="M2 10h28M10 29h12M16 25v4M8 16h7M8 20h12"/></g><text x="27" y="110" class="cyan" font-size="13" letter-spacing="2.5">EXPERIÊNCIA</text><text x="26" y="155" class="white" font-size="25" font-weight="600" letter-spacing="-.5">Interfaces que fazem sentido.</text><text x="27" y="203" class="muted" font-size="17">Clareza em cada interação.</text><text x="27" y="235" class="muted" font-size="17">Fluxos pensados para a rotina real.</text><text x="27" y="267" class="muted" font-size="17">Menos esforço para realizar tarefas.</text></g><g transform="translate(432 0)"><rect x="1" y="1" width="414" height="328" rx="16" fill="#0B1423" stroke="#24364D"/><path d="M26 1h58" stroke="#50D6F1" stroke-width="2"/><g transform="translate(27 34)" stroke="#60DDF0" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m10 7-8 9 8 9m12-18 8 9-8 9M19 3l-6 26"/></g><text x="27" y="110" class="cyan" font-size="13" letter-spacing="2.5">ENGENHARIA</text><text x="26" y="155" class="white" font-size="25" font-weight="600" letter-spacing="-.5">Software que resolve.</text><text x="27" y="203" class="muted" font-size="17">Sistemas personalizados e soluções prontas.</text><text x="27" y="235" class="muted" font-size="17">Funcionalidades alinhadas ao negócio.</text><text x="27" y="267" class="muted" font-size="17">Evolução orientada às necessidades.</text></g><g transform="translate(864 0)"><rect x="1" y="1" width="414" height="328" rx="16" fill="#0B1423" stroke="#24364D"/><path d="M26 1h58" stroke="#50D6F1" stroke-width="2"/><g transform="translate(27 34)" stroke="#60DDF0" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="1" width="10" height="9" rx="2"/><rect x="1" y="22" width="10" height="9" rx="2"/><rect x="21" y="22" width="10" height="9" rx="2"/><path d="M16 10v7M6 22v-5h20v5"/></g><text x="27" y="110" class="cyan" font-size="13" letter-spacing="2.5">INTEGRAÇÃO</text><text x="26" y="155" class="white" font-size="25" font-weight="600" letter-spacing="-.5">Operações que se conectam.</text><text x="27" y="203" class="muted" font-size="17">Processos e informações integrados.</text><text x="27" y="235" class="muted" font-size="17">Automação de tarefas repetitivas.</text><text x="27" y="267" class="muted" font-size="17">Dados para apoiar decisões.</text></g></svg>